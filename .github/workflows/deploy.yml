name: Rebuild OAS Insights

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "OAS Insights Bot"
          git config user.email "info@oassolutions.com.ng"

      - name: Trigger Cloudflare Pages rebuild
        run: |
          echo "Last rebuild: $(date -u)" > .last-rebuild
          git add .last-rebuild
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "chore: rebuild OAS Insights $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main
